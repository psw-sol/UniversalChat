# =============================================================================
# Nginx TCP Load Balancer for UniversalChatServer
# =============================================================================

worker_processes auto;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

# TCP stream proxy for chat server
stream {
    # Logging
    log_format tcp_proxy '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr"';

    access_log /var/log/nginx/tcp_access.log tcp_proxy;
    error_log /var/log/nginx/tcp_error.log;

    # Upstream chat servers
    upstream chat_backend {
        # IP hash for sticky sessions (same client -> same server)
        hash $remote_addr consistent;

        # Chat server instances (Docker DNS resolves container names)
        server chat-server:7777 max_fails=3 fail_timeout=30s;

        # For scaled deployments, Docker Compose automatically adds instances
        # The 'chat-server' service name resolves to all container IPs
    }

    # Chat server TCP proxy
    server {
        listen 7777;

        proxy_pass chat_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;

        # TCP keepalive
        proxy_socket_keepalive on;
    }
}

# HTTP server for health checks
http {
    server {
        listen 80;
        server_name localhost;

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.28.0.0/16;
            deny all;
        }
    }
}
