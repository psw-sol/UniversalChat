# =============================================================================
# UniversalChatServer Scaled Deployment
# Use: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale chat-server=4
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Chat Server (Scaled)
  # ---------------------------------------------------------------------------
  chat-server:
    # Remove fixed container name for scaling
    container_name: ""
    # Remove port mapping (handled by nginx)
    ports: []
    # Add labels for load balancer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chat.localhost`)"
      - "traefik.http.services.chat.loadbalancer.server.port=7777"

  # ---------------------------------------------------------------------------
  # Nginx Load Balancer
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-server
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7777/health"]
      interval: 30s
      timeout: 10s
      retries: 3
